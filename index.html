<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UdiSong La real</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: blue;
            display: flex;
            height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: blue;
            margin-bottom: 30px;
        }
        .nav a {
            color: #b3b3b3;
            text-decoration: none;
            margin: 10px 0;
            display: block;
        }
        .nav a:hover {
            color: #1db954;
        }
        /* Main */
        .main {
            flex-grow: 1;
            background-color: #181818;
            overflow-y: auto;
            position: relative;
        }
        header {
            padding: 20px;
            background: #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header input {
            padding: 10px;
            border: none;
            border-radius: 20px;
            width: 300px;
            outline: none;
        }
        /* Resultados de búsqueda */
        #searchResults {
            position: absolute;
            top: 70px;
            right: 20px;
            background: #282828;
            border-radius: 10px;
            width: 300px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: none;
            z-index: 100;
        }
        .result-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        .result-item:hover {
            background: #333;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: #282828;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
            background: #333;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        /* Player */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }
        .controls button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .controls button:hover {
            color: #1db954;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div>
            <div class="logo">UdiSong</div>
            <div class="nav">
                <a href="#">Inicio</a>
                <a href="#">Buscar</a>
                <a href="#">Tu Biblioteca</a>
            </div>
        </div>
        <div class="nav">
            <a href="#">Configuración</a>
            <a href="#">Cerrar Sesión</a>
        </div>
    </div>

    <div class="main">
        <header>
            <h2>Explorar</h2>
            <div style="position: relative;">
                <input type="text" id="searchInput" placeholder="Buscar canciones, artistas...">
                <div id="searchResults"></div>
            </div>
        </header>

        <div class="cards" id="cardsContainer">
            <div class="card">
                <img src="https://picsum.photos/200?1" alt="Album 1">
                <h4>Playlist Chill</h4>
                <p>Relájate con buena música</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/200?2" alt="Album 2">
                <h4>Top Hits</h4>
                <p>Lo más escuchado hoy</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/200?3" alt="Album 3">
                <h4>Workout</h4>
                <p>Activa tu energía</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/200?4" alt="Album 4">
                <h4>Focus Mix</h4>
                <p>Concentración total</p>
            </div>
        </div>
    </div>

    <div class="player">
        <div>🎵 Reproduciendo: <strong>Nothing Else Matters</strong> - Metallica</div>
        <div class="controls">
            <button>⏮️</button>
            <button>⏯️</button>
            <button>⏭️</button>
        </div>
    </div>

    <script>
        const artistas = [
            "Bad Bunny", "Taylor Swift", "Metallica", "Shakira",
            "Dua Lipa", "Feid", "The Weeknd", "Adele",
            "Karol G", "Miley Cyrus", "Arctic Monkeys", "Billie Eilish"
        ];

        const searchInput = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.toLowerCase();
            searchResults.innerHTML = "";

            if (query.trim() === "") {
                searchResults.style.display = "none";
                return;
            }

            const resultadosFiltrados = artistas.filter(artista =>
                artista.toLowerCase().includes(query)
            );

            if (resultadosFiltrados.length === 0) {
                searchResults.innerHTML = "<div class='result-item'>No se encontraron artistas</div>";
            } else {
                resultadosFiltrados.forEach(artista => {
                    const div = document.createElement("div");
                    div.classList.add("result-item");
                    div.textContent = artista;
                    div.addEventListener("click", () => {
                        searchInput.value = artista;
                        searchResults.style.display = "none";
                    });
                    searchResults.appendChild(div);
                });
            }

            searchResults.style.display = "block";
        });

        // Ocultar resultados al hacer clic fuera
        document.addEventListener("click", (e) => {
            if (!searchResults.contains(e.target) && e.target !== searchInput) {
                searchResults.style.display = "none";
            }
        });
    </script>
</body>
</html>
